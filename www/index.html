/* ---------- diagnostics ---------- */
const DG={on:0};
function dgReset(){Object.assign(DG,{n:0,lagSum:0,lagMax:0,co:0,pmin:9,pmax:-1,types:{},tilt:0,pred:0,t0:performance.now(),first:0,last:0,fr:0,drop:0,worst:0,ft:performance.now(),moves:0,gaps:0})}
function dgFrame(t){if(!DG.on)return;const d=t-DG.ft;DG.ft=t;if(d>0){DG.fr++;if(d>24)DG.drop++;DG.worst=Math.max(DG.worst,d)}requestAnimationFrame(dgFrame)}
function dgEvt(e){if(e.type!=='pointermove'&&e.type!=='pointerdown')return;const now=performance.now(),lag=Math.max(0,now-e.timeStamp);
 if(e.type==='pointermove'){DG.n++;DG.lagSum+=lag;DG.lagMax=Math.max(DG.lagMax,lag);DG.co+=e.getCoalescedEvents?e.getCoalescedEvents().length:1;if(e.getPredictedEvents&&e.getPredictedEvents().length)DG.pred++;if(DG.last&&now-DG.last>40)DG.gaps++;DG.last=now}
 DG.types[e.pointerType]=(DG.types[e.pointerType]||0)+1;if(e.pointerType==='pen'){DG.pmin=Math.min(DG.pmin,e.pressure);DG.pmax=Math.max(DG.pmax,e.pressure)}if(e.tiltX||e.tiltY)DG.tilt=1}
function dgReport(){const sec=Math.max(.1,(performance.now()-DG.t0)/1000),f=x=>x.toFixed(1),n=DG.n||1,ty=Object.entries(DG.types).map(([k,v])=>k+':'+v).join(' ')||'—';
 return[`Larpful diagnostics`,`Screen: ${innerWidth}x${innerHeight} @${devicePixelRatio}x · CPU threads: ${navigator.hardwareConcurrency||'?'} · RAM hint: ${navigator.deviceMemory||'?'} GB`,
 `Input: ${ty}`,`Pen events: ${DG.n} (${f(DG.n/sec)}/s) · merged samples per event: ${f(DG.co/n)} · prediction available: ${DG.n?Math.round(DG.pred*100/DG.n):0}%`,
 `Input delay: avg ${f(DG.lagSum/n)} ms · worst ${f(DG.lagMax)} ms · stalls >40 ms: ${DG.gaps}`,
 `Screen frames: ${DG.fr} · dropped (>24 ms): ${DG.drop} (${f(DG.drop*100/Math.max(1,DG.fr))}%) · worst frame: ${f(DG.worst)} ms`,
 `Pressure: ${DG.pmax<0?'no pen pressure seen':f(DG.pmin)+' – '+f(DG.pmax)} · tilt: ${DG.tilt?'yes':'not seen'}`,
 `Low-latency canvas: ${st.lowLat?'on':'off'} · prediction: ${st.predOn?'on':'off'} · last save: ${S.lastSaveMs||0} ms`].join('\n')}
function dgOpen(){
 sheetOpen('Diagnostics',`<div class="grp" style="padding:10px 14px"><p class="mini">Write or draw in the box below with the pencil for 10 seconds, then press “Copy report”. Send the report to Claude to tune the app for your tablet.</p><canvas id="dgc" style="width:100%;height:240px;border:1px solid var(--bd,#8884);border-radius:10px;touch-action:none;background:#fff"></canvas><pre id="dgr" style="white-space:pre-wrap;font-size:12px;margin:10px 0"></pre><div style="display:flex;gap:8px"><button class="chip" data-a="dgreset">Restart test</button><button class="chip" data-a="dgcopy">Copy report</button></div></div>`);
 const cv=$('#dgc');if(!cv)return;const r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;const x=cv.getContext('2d',{desynchronized:!!st.lowLat});x.scale(dpr,dpr);x.lineCap='round';x.lineJoin='round';
 let last=null;dgReset();DG.on=1;requestAnimationFrame(t=>{DG.ft=t;dgFrame(t)});
 cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);const b=cv.getBoundingClientRect();last={x:e.clientX-b.left,y:e.clientY-b.top};dgEvt(e)});
 cv.addEventListener('pointermove',e=>{dgEvt(e);if(!last||!e.buttons&&e.pointerType!=='pen')return;const b=cv.getBoundingClientRect();for(const v of(e.getCoalescedEvents?e.getCoalescedEvents():[e])){const q={x:v.clientX-b.left,y:v.clientY-b.top};x.strokeStyle='#111';x.lineWidth=1+(v.pressure||.5)*4;x.beginPath();x.moveTo(last.x,last.y);x.lineTo(q.x,q.y);x.stroke();last=q}});
 cv.addEventListener('pointerup',()=>{last=null});cv.addEventListener('pointercancel',()=>{last=null});
 const iv=setInterval(()=>{const o=$('#dgr');if(!o||!$('#dgc')){clearInterval(iv);DG.on=0;return}o.textContent=dgReport()},500);
 DG.cv=cv;DG.x=x}
Object.assign(A3,{diagopen:dgOpen,dgreset:()=>{dgReset();if(DG.x)DG.x.clearRect(0,0,DG.cv.width,DG.cv.height)},
 dgcopy:async()=>{const t=dgReport();try{await navigator.clipboard.writeText(t);toast('Report copied')}catch(e){const o=$('#dgr');if(o){const g=getSelection(),rg=document.createRange();rg.selectNodeContents(o);g.removeAllRanges();g.addRange(rg)}toast('Select and copy the text shown')}}});
CFG.push(['Pen Speed & Diagnostics',[cB('predOn','Predict pen position (feels faster)'),cN('predN','Prediction length',1,8,1,' points'),cN('predA','Prediction opacity',30,100,5,'%'),cA('diagopen','Run the pen & performance test…')],{closed:1}]);
/* ================= end v3 ================= */
theme();NBS.forEach(n=>n.pages.forEach(p=>p.tpl=p.tpl||'ruled'));if(innerWidth<820)$('#side').classList.add('off');load();
</script></body></html>
