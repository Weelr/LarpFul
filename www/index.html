.sb-h span{font-weight:500;text-transform:none;letter-spacing:0}
.nl{display:flex;flex-direction:column;gap:2px}
.nr{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:12px;text-align:left;transition:background .12s}
.nr:active{background:var(--fill)}.nr.on{background:var(--sel)}

.nr img{width:46px;height:62px;flex:none;object-fit:cover;object-position:top;border-radius:5px;box-shadow:0 0 0 .5px var(--hair),0 2px 6px rgba(0,0,0,.22)}

.nr b{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nr small{color:var(--s);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nr .tg{color:var(--a)}.nr .pn{color:var(--tint);flex:none}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;padding:4px 6px 10px}
.pt{display:block;text-align:center;border-radius:8px;min-width:0}
.pt img{display:block;width:100%;height:auto;border-radius:4px;box-shadow:0 0 0 .5px var(--hair),0 2px 8px rgba(0,0,0,.2);outline:3px solid transparent;outline-offset:2px;transition:outline-color .15s}
.pt.on img{outline-color:var(--a)}
.pt span{display:inline-block;margin-top:7px;min-width:24px;padding:1px 8px;border-radius:100px;font-size:12px;color:var(--s)}
.pt.on span{background:var(--a);color:#fff;font-weight:600}
.si .n{margin-left:auto}
/* ===== performance: no live blur over the canvas ===== */

#tb,#zb,#batch,.menu,#pop{background:var(--glass2)}
.bar{background:var(--p)}
#sheetbg{background:rgba(0,0,0,.32)}
#sheet .nav{background:var(--p)}
button,input,select,.si,.nr,.pt{touch-action:manipulation}
#sheet,#side{overscroll-behavior:contain}
/* toggles: GPU-friendly (transform instead of left) */
.sw2:after{left:2px;transition:transform .25s cubic-bezier(.3,.9,.3,1),width .2s;will-change:transform}
.sw2:checked:after{left:2px;transform:translateX(20px)}
.sw2:active:after{width:33px}.sw2:checked:active:after{transform:translateX(14px)}
.sw2{transition:background .2s}

#sheet,#pop,.menu{animation:up .2s cubic-bezier(.2,.9,.3,1) both}

.th img{transition:transform .15s}

ermode:()=>{st.erMode=v;save();$('#pop').hidden=true;toast(v==='pixel'?'Brush eraser':'Whole-stroke eraser')},
favs:()=>{popT('col',a);const p=$('#pop');p.dataset.k='fav';p.innerHTML=favHTML()},
favsave:()=>{const i=INST(S.ai);if(!i)return;(st.fav||(st.fav=[])).push({k:i.k,c:i.c,w:i.w,o:i.o});if(st.fav.length>8)st.fav.shift();save();tb();const p=$('#pop');if(!p.hidden&&p.dataset.k==='fav')p.innerHTML=favHTML();else toast('Saved to favorites')},
favuse:()=>{const f=(st.fav||[])[+v];if(!f)return;let i=INST(S.ai);if(!i||i.k!==f.k)i=st.inst.find(x=>x.k===f.k);if(!i)return;Object.assign(i,{c:f.c,w:f.w,o:f.o});loadInst(i);save();$('#pop').hidden=true;setTool(f.k)},
favdel:()=>{st.fav.splice(+v,1);save();tb();$('#pop').innerHTML=favHTML()},
del:()=>{if(!confirm('Delete forever? This cannot be undone.'))return;const i=NBS.findIndex(n=>n.id==v);if(i>=0)NBS.splice(i,1);S.dirty=1;home();saveAll(1,1)},
fab:()=>{const m=document.createElement('div');m.className='menu';m.innerHTML='<button data-a="new">New notebook</button><button data-a="imppdf">Upload PDF (as is)</button><button data-a="imp">Upload other file → convert to PDF</button><button data-a="impfn">Import FreeNotes backup (.freebackup)</button>';$('#home').append(m);setTimeout(()=>document.addEventListener('click',()=>m.remove(),{once:true}),0)},
new:()=>{const n=mkNb('Untitled',S.filter.startsWith('t:')?S.filter.slice(2):'');NBS.push(n);S.dirty=1;openNb(n)},imp:()=>$('#file').click(),impfn:()=>{$('#sheetbg').hidden=true;$('#fnf').click()},imppdf:()=>$('#pdff').click(),back:()=>{$('#ed').hidden=true;$('#home').hidden=false;$('#rl').hidden=true;$('#pop').hidden=true;const d=$('#side');d.classList.remove('ov');innerWidth>=820?d.classList.remove('off'):d.classList.add('off');home();saveAll()},
tool:()=>{if(S.tool===v&&v==='mv'){mvScale();return}if(S.tool===v&&v!=='tx'&&v!=='mv'){popT(v,a);return}$('#pop').hidden=true;setTool(v)},
ruler:()=>{R.on^=1;rul();tb()},undo,redo,pop:()=>popT('col',a),col:()=>setCol(v),
inst:()=>{const i=INST(v);if(S.ai===v&&S.tool===i.k){popT(i.k,a);return}$('#pop').hidden=true;loadInst(i);setTool(i.k)},
addinst:()=>{const b=S.tool==='hl'?'hl':'pen',n=st.inst.filter(x=>x.k===b).length,pal=['#0a84ff','#ff3b30','#34c759','#ff9f0a','#af52de'],i={id:b[0]+Date.now().toString(36),k:b,c:pal[n%5],w:CFG2[b].w,o:CFG2[b].o};st.inst.push(i);loadInst(i);save();setTool(b)},
delinst:()=>{const i=INST(S.ai);if(!i)return;st.inst=st.inst.filter(x=>x!==i);loadInst(st.inst.find(x=>x.k===i.k)||st.inst[0]);save();$('#pop').hidden=true;setTool(INST(S.ai).k)},shape:()=>{S.shape=v;$('#pop').hidden=true},addpg:addPg,exp,'z+':()=>zoom(PN[S.fp].z*1.2),'z-':()=>zoom(PN[S.fp].z/1.2),zf:()=>fit(PN[S.fp])};A[a.dataset.a]?.()});
document.addEventListener('keydown',e=>{if(!S.nb||$('#ed').hidden)return;if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.shiftKey?redo():undo()}if(e.key==='e')setTool('er',1)});
['side','side2','sort','back','add','exp','fab','sel','rec','recs','srch','split','qex','paper'].forEach(k=>{const b=$('#i-'+k)||$('#'+k);if(b)b.innerHTML=ic({side:'side',side2:'side',sort:'sort',back:'back',add:'pgp',exp:'dl',fab:'plus',sel:'check',rec:'mic',recs:'phones',srch:'search',split:'split',qex:'share',paper:'paper'}[k],k==='fab'?30:22)});
/* ===== autosave (IndexedDB, every 3 min) ===== */
const DBo=()=>new Promise((ok,no)=>{const r=indexedDB.open('larpful',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const dbSet=async(k,v)=>{const d=await DBo();return new Promise((ok,no)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})};
const dbGet=async k=>{const d=await DBo();return new Promise((ok,no)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})};
async function saveAll(force,quiet){if(!force&&!S.dirty)return;try{await dbSet('nbs',NBS.map(n=>({...n,pages:n.pages.map(p=>({w:p.w,h:p.h,tpl:p.tpl,label:p.label,col:p.col,strokes:p.strokes.map(({im,...r})=>r),imgURL:p.imgURL,txt:p.txt}))})));S.dirty=0;if(!quiet){const e=$('#sv');e.style.opacity=1;setTimeout(()=>e.style.opacity=0,1600)}}catch(err){console.error(err)}}
async function load(){try{const d=await dbGet('nbs');if(Array.isArray(d)){for(const n of d)for(const p of n.pages){p.hist=[];p.redo=[];if(p.imgURL)p.img=await ldImg(p.imgURL)}NBS.splice(0,NBS.length,...d)}else S.dirty=1}catch(e){console.error(e)}S.loaded=1;home();saveAll(1,1)}
setInterval(()=>st.autosave&&saveAll(),180000);document.addEventListener('visibilitychange',()=>document.hidden&&saveAll());addEventListener('pagehide',()=>saveAll());
/* ===== M-Pencil side button / tap (rising edge, works while hovering) ===== */
document.addEventListener('keydown',e=>{if((e.key==='F20'||e.code==='F20')&&!e.repeat){e.preventDefault();if(!st.barrel2||!S.nb||$('#ed').hidden)return;const n=Date.now();if(S.f20&&n-S.f20<500){S.f20=0;if(S.tool==='er'){setTool(S.prev||'pen');S.prev=null}else{setTool('er',1)}navigator.vibrate&&navigator.vibrate(15)}else S.f20=n}},true);
document.addEventListener('keydown',e=>{st.dbg&&toast('key '+e.key+' / '+e.code)},true);
function penEdge(e){if(e.pointerType!=='pen')return;if(st.dbg&&e.buttons!==S.dbb){S.dbb=e.buttons;toast('pen buttons='+e.buttons+' button='+e.button)}const b=!!(e.buttons&34||e.button===5);if(b&&!S.lb&&S.nb&&!$('#ed').hidden){const n=Date.now(),tg=()=>S.tool==='er'?(setTool(S.prev||'pen'),S.prev=null):setTool('er',1);if(st.penBtn==='toggle')tg();else if(st.barrel2){if(S.bt&&n-S.bt<450){S.bt=0;tg()}else S.bt=n}}S.lb=b}
['pointermove','pointerdown','pointerup'].forEach(t=>document.addEventListener(t,penEdge,true));
/* ===== pinch zoom + pan (live CSS scale, sharp re-render on release) — independent per pane ===== */
function css(p){const z=p.pane.z;[p.cb,p.ci,p.d].forEach(c=>{c.style.width=p.w*z+'px';c.style.height=p.h*z+'px'})}
function pinch(pn,f,cx,cy){const nb=pn.nb();if(!nb)return;const b=pn.box,r=b.getBoundingClientRect(),z=Math.max(.4,Math.min(4,pn.z*f)),k=z/pn.z;if(k===1)return;const px=cx-r.left,py=cy-r.top,L=(b.scrollLeft+px)*k-px,T=(b.scrollTop+py)*k-py;pn.z=z;nb.pages.forEach(css);b.scrollLeft=L;b.scrollTop=T;S.pz=pn;ind(pn)}
function commitZ(pn){const nb=pn.nb();if(!nb)return;nb.pages.forEach(lay);ind(pn)}
PN.forEach(pn=>pn.box.addEventListener('wheel',e=>{if(S.split&&S.fp!==pn.i){e.preventDefault();return}if(e.ctrlKey){e.preventDefault();pinch(pn,e.deltaY<0?1.08:.93,e.clientX,e.clientY);clearTimeout(pn.zt);pn.zt=setTimeout(()=>{if(S.pz===pn)S.pz=0;commitZ(pn)},180)}},{passive:false}));
/* ===== full screen + sidebar auto-hide ===== */
document.addEventListener('pointerdown',()=>{if(st.full&&!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{})},{once:true});
document.addEventListener('pointerdown',e=>{const d=$('#side');if(d.classList.contains('ov')&&!d.classList.contains('off')&&!e.target.closest('#side,[data-a=side2]'))d.classList.add('off')},true);
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.pk;if(!k)return;CFG2[$('#pop').dataset.k][k]=+e.target.value;e.target.previousElementSibling.textContent=e.target.value;syncInst()});
document.addEventListener('change',e=>{const d=e.target.dataset||{};if('cc' in d)setCol(e.target.value);else if('hx' in d){let v=e.target.value.trim();if(v[0]!=='#')v='#'+v;/^#[0-9a-f]{6}$/i.test(v)?setCol(v.toLowerCase()):toast('Use a 6-digit hex like #1e90ff')}});
theme();NBS.forEach(n=>n.pages.forEach(p=>p.tpl=p.tpl||'ruled'));if(innerWidth<820)$('#side').classList.add('off');load();
</script></body></html>
