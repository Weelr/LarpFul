function penEdge(e){if(e.pointerType!=='pen')return;if(st.dbg&&e.buttons!==S.dbb){S.dbb=e.buttons;toast('pen buttons='+e.buttons+' button='+e.button)}const b=!!(e.buttons&34||e.button===5);if(b&&!S.lb&&S.nb&&!$('#ed').hidden){const n=Date.now(),tg=()=>S.tool==='er'?(setTool(S.prev||'pen'),S.prev=null):setTool('er',1);if(st.penBtn==='toggle')tg();else if(st.barrel2){if(S.bt&&n-S.bt<450){S.bt=0;tg()}else S.bt=n}}S.lb=b}
['pointermove','pointerdown','pointerup'].forEach(t=>document.addEventListener(t,penEdge,true));
/* ===== pinch zoom + pan (live CSS scale, sharp re-render on release) ===== */
function css(p){const z=S.z;[p.cb,p.ci,p.d].forEach(c=>{c.style.width=p.w*z+'px';c.style.height=p.h*z+'px'})}
function pinch(f,cx,cy){if(!S.nb)return;const b=$('#pages'),r=b.getBoundingClientRect(),z=Math.max(.4,Math.min(4,S.z*f)),k=z/S.z;if(k===1)return;const px=cx-r.left,py=cy-r.top,L=(b.scrollLeft+px)*k-px,T=(b.scrollTop+py)*k-py;S.z=z;S.nb.pages.forEach(css);b.scrollLeft=L;b.scrollTop=T;S.pz=1;ind()}
function commitZ(){allPg().forEach(lay);ind()}
$('#pages').addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();pinch(e.deltaY<0?1.08:.93,e.clientX,e.clientY);clearTimeout(S.zt);S.zt=setTimeout(()=>{S.pz=0;commitZ()},180)}},{passive:false});
