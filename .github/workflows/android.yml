name: Build Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Bundle PDF libraries locally
        run: |
          mkdir -p www/lib
          curl -fsSL -o www/lib/pdf.min.js https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js
          curl -fsSL -o www/lib/pdf.worker.min.js https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js
          curl -fsSL -o www/lib/jspdf.umd.min.js https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js
          curl -fsSL -o www/lib/jszip.min.js https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/#lib/#g; s#https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/#lib/#g; s#https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/#lib/#g' www/index.html
      - run: npm install
      - run: npx cap add android
      - name: Microphone permission
        run: |
          python3 - <<'EOF'
          p='android/app/src/main/AndroidManifest.xml'
          x=open(p).read()
          f='<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="content"/><data android:scheme="file"/><data android:mimeType="application/pdf"/><data android:mimeType="image/*"/><data android:mimeType="text/plain"/><data android:mimeType="application/vnd.openxmlformats-officedocument.wordprocessingml.document"/><data android:mimeType="application/vnd.openxmlformats-officedocument.presentationml.presentation"/></intent-filter>'
          x=x.replace('</activity>',f+'</activity>',1)
          open(p,'w').write(x)
          EOF
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" /><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" /><application#' android/app/src/main/AndroidManifest.xml
      - name: Fullscreen immersive mode
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java)
          cat > $F <<'EOF'
          package com.larpful.app;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.OpenableColumns;
          import android.util.Base64;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b){ super.onCreate(b); hide(); handle(getIntent()); }
            @Override protected void onNewIntent(Intent i){ super.onNewIntent(i); handle(i); }
            @Override public void onWindowFocusChanged(boolean f){ super.onWindowFocusChanged(f); if(f) hide(); }
            private void handle(Intent i){
              if(i==null||!Intent.ACTION_VIEW.equals(i.getAction())||i.getData()==null) return;
              try{
                Uri u=i.getData(); String name="file";
                Cursor c=getContentResolver().query(u,null,null,null,null);
                if(c!=null){ if(c.moveToFirst()){ int ix=c.getColumnIndex(OpenableColumns.DISPLAY_NAME); if(ix>=0) name=c.getString(ix); } c.close(); }
                String mime=getContentResolver().getType(u); if(mime==null) mime="";
                InputStream in=getContentResolver().openInputStream(u);
                ByteArrayOutputStream o=new ByteArrayOutputStream(); byte[] buf=new byte[65536]; int n;
                while((n=in.read(buf))>0) o.write(buf,0,n);
                in.close();
                final String js="(function t(){if(window.larpfulOpen)window.larpfulOpen("+org.json.JSONObject.quote(name)+","+org.json.JSONObject.quote(mime)+",'"+Base64.encodeToString(o.toByteArray(),Base64.NO_WRAP)+"');else setTimeout(t,500)})()";
                getBridge().getWebView().postDelayed(() -> getBridge().getWebView().evaluateJavascript(js,null),1200);
              }catch(Exception e){}
            }
            private void hide(){
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              c.hide(WindowInsetsCompat.Type.systemBars());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
            }
          }
          EOF
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Larpful.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Larpful-apk
          path: Larpful.apk
